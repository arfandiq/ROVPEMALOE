# Runtime ROS parameters. Calibration/estimator drafts are not loaded.
pixhawk_bridge:
  ros__parameters:
    pixhawk_device: /dev/ttyACM0
    pixhawk_baud: 115200
    heartbeat_timeout: 5.0
    reconnect_interval: 5.0
    command_timeout: 0.5
    target_system: 1
    target_component: 1
    source_system: 255
    source_component: 190
    stream_rate: 20
    # Pixhawk-generated flow by default. For routed Arduino frames use its
    # actual source IDs (historical sketches differ: 240/41, 1/192, 1/191).
    optical_flow_system: 1
    optical_flow_component: 1
rov_controller:
  ros__parameters:
    joy_topic: /joy
    control_topic: /rovpemaloe/control_command
    deadzone: 0.15
    command_timeout: 0.5
    pwm_min: 1000
    pwm_max: 2000
    pwm_neutral: 1500
imu_monitor:
  ros__parameters:
    imu_topic: /rovpemaloe/imu
    print_raw: true
imu_data_logger:
  ros__parameters:
    imu_topic: /rovpemaloe/imu
    output_dir: ~/rovpemaloe_logs
    enable_logging: true

usb_camera:
  ros__parameters:
    device: /dev/video0
    width: 1920
    height: 1080
    fps: 30.0
    jpeg_quality: 85
    reconnect_interval: 2.0
    image_topic: /rovpemaloe/camera/image/compressed
