# IMU Data Logger Configuration

imu_data_logger:
  ros__parameters:
    # Output directory for CSV files
    # Default: ~/rovpemaloe_logs
    output_dir: "~/rovpemaloe_logs"

    # IMU topic to subscribe to
    # MAVROS publishes IMU data here
    imu_topic: "/rovpemaloe/imu"

    # Enable/disable logging (useful for testing without writing files)
    enable_logging: true
